    <div> select:

    <h1>grouping tag select</h1>
    <label for="city">choose and select: </label>
    <select name="city" id="city">
        <optgroup label="Middle">
            <option value="kbl">Kabul</option>
            <option value="bng">Beijing</option>
        </optgroup>
        <optgroup label="south">
            <option value="Pakistan">Pakistan</option>
            <option value="India">India</option>
        </optgroup>
    </select>

    <div>

                <input type="text" name="name" id="name" placeholder="enter our name">
            </fieldset>
            <fieldset>
                <legend>contact info: </legend>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
            </fieldset>
            <fieldset>
                <legend>gender: </legend>
                <label for="male">Male</label>&nbsp;&nbsp;&nbsp;
                <input type="radio" name="gender" id="male">
                <br>
                <label for="female">Female</label>
                <input type="radio" name="gender" id="female">
            </fieldset>
            <fieldset>
                <legend>comment: </legend>

            </fieldset>
