<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>semantic</title>
</head>
<body>
    <h1>a little bit know about semantics</h1>
    <h2>in html 5 figure tag </h2>
    <!-- figure is used to keep img tag -->

    <figure>
        <img src="./review_1.png" alt="" width="300px" height="400px">
    </figure>

    <br><hr><hr><hr><br><br>

    <picture>
        <source media="(min-width: 800px)" srcset="./review_1.png">
        <source media="(min-width: 400px)" srcset="./flutter.png">
        <img src="./t148724488.jpg" alt="image">
    </picture>
     <!-- more practice -->
      <h3>
        more practice
      </h3>
</body>
</html>
